services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      - redis

  worker:
    build: .
    command: python -m app.workers.document_worker
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"

